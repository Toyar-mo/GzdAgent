# CTF 竞赛专用配置
# 使用方式：./gzd-agent --config config-ctf.yaml

# 继承基础配置，仅覆盖 CTF 相关项
server:
  host: "0.0.0.0"
  port: 8080

ai:
  default_channel: "deepseek"
  channels:
    deepseek:
      provider: "openai"
      base_url: "https://api.deepseek.com/v1"
      api_key: "${DEEPSEEK_API_KEY}"
      model: "deepseek-chat"
      temperature: 0.1          # 降低随机性，提高确定性
      max_tokens: 4096

agent:
  max_iterations: 15            # CTF 不需要 12000 步，15 步足够
  tool_timeout_minutes: 5       # 单工具 5 分钟超时
  max_concurrent_tools: 3       # 允许并行调用 3 个工具
  workspace: "./data/agent-workspace"

ctf_knowledge:
  enabled: true
  wp_dir: ./wp
  top_k: 3                      # 只返回前 3 个匹配，减少 LLM 读取量

# 关闭不需要的功能，减少资源占用
knowledge:
  enabled: false                # CTF 不需要 RAG 知识库

monitor:
  retention_days: 1             # 减少日志保留

log:
  level: "warn"                 # 减少日志输出