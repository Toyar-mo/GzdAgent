
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Result</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: white;
        }
        .result-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 2rem;
            width: 300px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .result-container h2 {
            margin-bottom: 1.5rem;
        }
        .message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 5px;
        }
        .success {
            background: rgba(76, 175, 80, 0.3);
        }
        .error {
            background: rgba(244, 67, 54, 0.3);
        }
        .info {
            background: rgba(33, 150, 243, 0.3);
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .back-button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            background: #2196F3;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }
        .back-button:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h2>CTFshow Verification Result</h2>
        <div class="message error">Invalid username or password</div><button class="back-button" onclick="window.history.back()">Back to Login</button>    </div>
</body>
</html>
